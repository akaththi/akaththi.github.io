<style>
/* ── ARTICLE HERO */
.article-hero{background:var(--g);padding:120px 52px 80px;margin-top:64px;}
.article-hero-inner{max-width:760px;margin:0 auto;}
.back-link{display:inline-flex;align-items:center;gap:8px;font-size:9.5px;font-weight:500;letter-spacing:.18em;text-transform:uppercase;color:rgba(255,255,255,.42);text-decoration:none;margin-bottom:32px;transition:color .2s;}
.back-link:hover{color:rgba(255,255,255,.75);}
.back-arrow{font-size:12px;line-height:1;}
.article-meta{display:flex;align-items:center;gap:12px;margin-bottom:18px;}
.article-tag{font-size:8.5px;font-weight:500;letter-spacing:.22em;text-transform:uppercase;color:var(--g3);background:rgba(255,255,255,.07);padding:4px 10px;}
.article-date{font-size:10px;font-weight:300;color:rgba(255,255,255,.35);letter-spacing:.06em;}
.article-hero-h{font-family:'Bebas Neue',sans-serif;font-size:clamp(48px,8vw,100px);color:#fff;line-height:.9;letter-spacing:.01em;margin-bottom:22px;}
.article-hook{font-size:18px;font-weight:300;line-height:1.7;color:rgba(255,255,255,.55);max-width:560px;}

/* ── ARTICLE BODY */
.article-body{padding:80px 52px 100px;background:var(--w);}
.article-body-inner{max-width:760px;margin:0 auto;}

/* Scoped content styles — applies to both HTML body strings and markdown output */
.article-body-inner p{font-size:17px;font-weight:300;line-height:1.9;color:var(--ink);margin-bottom:22px;}
.article-body-inner h2{font-family:'Bebas Neue',sans-serif;font-size:clamp(28px,3.5vw,44px);color:var(--g);letter-spacing:.01em;line-height:.95;margin-bottom:20px;margin-top:52px;}
.article-body-inner h3{font-size:18px;font-weight:500;color:var(--ink);line-height:1.3;margin-bottom:14px;margin-top:36px;}
.article-body-inner ul,
.article-body-inner ol{padding-left:0;margin-bottom:22px;display:flex;flex-direction:column;gap:10px;}
.article-body-inner li{font-size:16px;font-weight:300;line-height:1.85;color:var(--ink);padding-left:22px;position:relative;}
.article-body-inner ul li::before{content:'';position:absolute;left:0;top:13px;width:7px;height:1.5px;background:var(--g2);}
.article-body-inner ol{counter-reset:ol-counter;}
.article-body-inner ol li{counter-increment:ol-counter;}
.article-body-inner ol li::before{content:counter(ol-counter) '.';position:absolute;left:0;top:0;font-size:12px;font-weight:500;color:var(--g2);}
.article-body-inner a{color:var(--g2);text-decoration:none;border-bottom:1px solid rgba(46,102,54,.2);transition:border-color .2s;}
.article-body-inner a:hover{border-bottom-color:var(--g2);}
.article-body-inner strong{font-weight:500;}
.article-body-inner em{font-style:italic;}
.article-body-inner blockquote{margin:36px 0;padding:0 0 0 26px;border-left:3px solid var(--g2);font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:300;font-size:clamp(19px,2.5vw,25px);color:var(--g);line-height:1.5;}
.article-body-inner blockquote p{font-size:inherit;color:inherit;font-family:inherit;font-style:inherit;margin-bottom:0;}
.article-body-inner code{background:var(--bg);padding:2px 7px;font-family:monospace;font-size:14px;letter-spacing:0;}
.article-body-inner pre{background:var(--bg);padding:22px;margin-bottom:22px;overflow-x:auto;border-left:3px solid var(--rule);}
.article-body-inner pre code{background:none;padding:0;}
.article-body-inner hr{border:none;border-top:1px solid var(--rule);margin:44px 0;}
.article-body-inner img{max-width:100%;height:auto;display:block;margin:32px 0;}

/* Loading / error state */
.article-loading{font-size:14px;font-weight:300;color:var(--mid);letter-spacing:.06em;}

@media(max-width:980px){
  .article-hero,.article-body{padding-left:20px!important;padding-right:20px!important;}
}
@media(max-width:580px){
  .article-hero{padding-top:80px;padding-bottom:52px;}
}
</style>
</head>
<body>

<div id="site-nav"></div>

<!-- Hero — populated by JS -->
<section class="article-hero">
  <div class="article-hero-inner">
    <a href="index.html" class="back-link"><span class="back-arrow">←</span> News &amp; Updates</a>
    <div class="article-meta">
      <span class="article-tag" id="article-tag"></span>
      <span class="article-date" id="article-date"></span>
    </div>
    <h1 class="article-hero-h" id="article-title">Loading...</h1>
    <p class="article-hook" id="article-hook"></p>
  </div>
</section>

<!-- Body — populated by JS -->
<section class="article-body">
  <div class="article-body-inner reveal" id="article-body-inner">
    <p class="article-loading">Loading article...</p>
  </div>
</section>

<div id="site-footer"></div>
<script>fetch('/footer.html').then(r=>r.text()).then(h=>{document.getElementById('site-footer').outerHTML=h;});</script>

<script src="_data/news.js"></script>
<script>
(function(){
  var params = new URLSearchParams(location.search);
  var slug = params.get('slug');

  function showError(msg){
    document.getElementById('article-title').textContent = 'Not found';
    document.getElementById('article-body-inner').innerHTML = '<p style="color:var(--mid)">'+msg+'</p>';
  }

  if(!slug){ showError('No article specified.'); return; }
  if(typeof NEWS === 'undefined'){ showError('Could not load news registry.'); return; }

  var post = NEWS.find(function(n){ return n.slug === slug; });
  if(!post){ showError('This article could not be found.'); return; }

  // Set page meta
  document.title = post.title + ' — Akaththí Farms';
  document.querySelector('meta[name="description"]').setAttribute('content', post.excerpt);
  document.getElementById('article-tag').textContent = post.tag;
  document.getElementById('article-date').textContent = post.date;
  document.getElementById('article-title').textContent = post.title;
  document.getElementById('article-hook').textContent = post.excerpt;

  var bodyEl = document.getElementById('article-body-inner');

  if(post.type === 'md'){
    // Load marked.js from CDN, then fetch and render the .md file
    bodyEl.innerHTML = '<p class="article-loading">Loading...</p>';
    var s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/marked@9/marked.min.js';
    s.onload = function(){
      fetch(post.slug + '.md')
        .then(function(r){
          if(!r.ok) throw new Error('Not found');
          return r.text();
        })
        .then(function(md){
          bodyEl.innerHTML = marked.parse(md);
        })
        .catch(function(){
          bodyEl.innerHTML = '<p style="color:var(--mid)">Could not load article content. Make sure news/'+post.slug+'.md exists.</p>';
        });
    };
    s.onerror = function(){ bodyEl.innerHTML = '<p style="color:var(--mid)">Could not load markdown renderer.</p>'; };
    document.head.appendChild(s);
  } else {
    bodyEl.innerHTML = post.body || '<p style="color:var(--mid)">No content.</p>';
  }
})();
</script>

<script>
const obs=new IntersectionObserver(entries=>{
  entries.forEach(e=>{if(e.isIntersecting){e.target.classList.add('visible');obs.unobserve(e.target);}});
},{threshold:0.1});
document.querySelectorAll('.reveal').forEach(el=>obs.observe(el));
</script>
<script src="/nav-loader.js"></script>
</body>
