<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>News — Akaththí Farms</title>
<meta name="description" content="News and updates from Akaththí Farms.">
<meta name="robots" content="noindex">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<div id="site-nav"></div>
<section style="margin-top:var(--nav-h);padding:120px 52px;text-align:center;">
  <p style="font-size:14px;font-weight:300;color:var(--mid);">Redirecting to the article…</p>
  <p style="margin-top:16px;"><a href="/news/" style="color:var(--g2);">Go to News &amp; Updates</a></p>
</section>
<script>
// Legacy URL shim: article.html?slug=<slug> now lives at /news/<slug>.html
(function(){
  var params = new URLSearchParams(location.search);
  var slug = params.get('slug');
  if(slug){
    location.replace('/news/' + slug + '.html');
  }
})();
</script>
<script src="/nav-loader.js"></script>
</body>
</html>
