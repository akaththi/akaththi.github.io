<link rel="stylesheet" href="/styles.css">
<style>
/* ── PAGE HERO */
.page-hero{background:var(--g);}
.page-hero-h{color:#fff;}
.page-hero-sub{color:rgba(255,255,255,.52);}

/* ── NEWS LISTING */
.sec-news{background:var(--bg);padding:80px 52px 100px;}
.news-inner{max-width:1200px;margin:0 auto;}
.news-filter{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:48px;}
.news-filter-btn{font-size:9px;font-weight:500;letter-spacing:.2em;text-transform:uppercase;
  color:var(--mid);background:none;border:1px solid rgba(27,63,32,.18);padding:7px 14px;
  cursor:pointer;transition:all .2s;}
.news-filter-btn:hover,.news-filter-btn.active{background:var(--g);color:#fff;border-color:var(--g);}
.news-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;}
.nc{background:var(--w);padding:32px 30px 36px;display:flex;flex-direction:column;
  border-top:2px solid transparent;transition:border-color .25s;text-decoration:none;}
.nc:hover{border-top-color:var(--g);}
.nc-meta{display:flex;gap:10px;align-items:center;margin-bottom:14px;}
.nc-tag{font-size:8px;font-weight:500;letter-spacing:.2em;text-transform:uppercase;
  color:var(--g2);background:rgba(46,102,54,.08);padding:3px 8px;}
.nc-date{font-size:10px;font-weight:300;color:var(--mid);opacity:.5;}
.nc-title{font-family:'Bebas Neue',sans-serif;font-size:26px;letter-spacing:.02em;
  color:var(--g);line-height:1.1;margin-bottom:12px;flex:1;}
.nc-body{font-size:13px;font-weight:300;line-height:1.72;color:var(--mid);}
.nc-link{margin-top:18px;font-size:9px;font-weight:500;letter-spacing:.18em;text-transform:uppercase;
  color:var(--g2);border-bottom:1px solid rgba(46,102,54,.2);padding-bottom:2px;
  align-self:flex-start;transition:opacity .2s;}
.nc:hover .nc-link{opacity:.6;}
.nc.hidden{display:none;}

/* ── EMPTY STATE */
.news-empty{grid-column:1/-1;padding:60px 0;font-size:13px;font-weight:300;color:var(--mid);letter-spacing:.06em;}

@media(max-width:980px){
  .news-grid{grid-template-columns:repeat(2,1fr);}
  .page-hero,.sec-news{padding-left:20px!important;padding-right:20px!important;}
}
@media(max-width:580px){
  .page-hero{padding-top:80px;padding-bottom:52px;}
  .news-grid{grid-template-columns:1fr!important;}
}
</style>
</head>
<body>

<div id="site-nav"></div>

<!-- § PAGE HERO -->
<section class="page-hero">
  <div class="page-hero-inner">
    <div class="lbl" style="color:rgba(255,255,255,.42);"><span class="lbl-sq" style="background:rgba(255,255,255,.25);"></span>From the Farm</div>
    <h1 class="page-hero-h">News &amp;<br>Updates.</h1>
    <p class="page-hero-sub">Harvests, science, company milestones — all dispatches from Akaththí Farms.</p>
  </div>
</section>

<!-- § NEWS GRID -->
<section class="sec-news">
  <div class="news-inner">
    <div class="news-filter reveal" id="filterBar"></div>
    <div class="news-grid reveal" id="newsGrid"></div>
  </div>
</section>

<div id="site-footer"></div>
<script>fetch('/footer.html').then(r=>r.text()).then(h=>{document.getElementById('site-footer').outerHTML=h;});</script>

<script src="_data/news.js"></script>
<script>
(function(){
  var grid = document.getElementById('newsGrid');
  var filterBar = document.getElementById('filterBar');
  if(!grid || typeof NEWS === 'undefined') return;

  // Collect unique tags
  var tags = ['All'];
  NEWS.forEach(function(n){ if(tags.indexOf(n.tag) === -1) tags.push(n.tag); });

  // Render filter buttons
  tags.forEach(function(tag){
    var btn = document.createElement('button');
    btn.className = 'news-filter-btn' + (tag === 'All' ? ' active' : '');
    btn.textContent = tag;
    btn.addEventListener('click', function(){
      document.querySelectorAll('.news-filter-btn').forEach(function(b){ b.classList.remove('active'); });
      btn.classList.add('active');
      var cards = grid.querySelectorAll('.nc');
      cards.forEach(function(card){
        card.classList.toggle('hidden', tag !== 'All' && card.dataset.tag !== tag);
      });
      var empty = grid.querySelector('.news-empty');
      var anyVisible = Array.from(cards).some(function(c){ return !c.classList.contains('hidden'); });
      if(empty) empty.style.display = anyVisible ? 'none' : 'block';
    });
    filterBar.appendChild(btn);
  });

  // Render all cards
  NEWS.forEach(function(n){
    var a = document.createElement('a');
    a.href = 'article.html?slug=' + n.slug;
    a.className = 'nc';
    a.dataset.tag = n.tag;
    a.innerHTML =
      '<div class="nc-meta"><span class="nc-tag">'+n.tag+'</span><span class="nc-date">'+n.date+'</span></div>'+
      '<div class="nc-title">'+n.title+'</div>'+
      '<p class="nc-body">'+n.excerpt+'</p>'+
      '<div class="nc-link">Read more →</div>';
    grid.appendChild(a);
  });

  if(NEWS.length === 0){
    var empty = document.createElement('p');
    empty.className = 'news-empty';
    empty.textContent = 'No updates yet — check back soon.';
    grid.appendChild(empty);
  }
})();
</script>

<script>
const obs=new IntersectionObserver(entries=>{
  entries.forEach(e=>{if(e.isIntersecting){e.target.classList.add('visible');obs.unobserve(e.target);}});
},{threshold:0.1});
document.querySelectorAll('.reveal').forEach(el=>obs.observe(el));
</script>
<script src="/nav-loader.js"></script>
</body>
</html>
